# Generated by the telecraft renderer. Do not edit by hand: change the source in git and render again.
# Tier data-flow/kafka-bridge (production), Blueprint data-flow/bridge-standard@2, commit c895127500d1bc82cee81b258c5e76042b2653aa.
receivers:
  kafka/kafka-in:
    brokers:
      - kafka-0.telemetry.internal:9092
      - kafka-1.telemetry.internal:9092
    group_id: telecraft-bridge
processors:
  batch/batcher:
    send_batch_size: 16384
    timeout: 10s
  memory_limiter/guard:
    check_interval: 1s
    limit_percentage: 70
    spike_limit_percentage: 20
exporters:
  otlp_http/data-flow.gateway-exporter:
    compression: gzip
    endpoint: https://ingest.observability.internal:4318
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 10000
extensions:
  health_check/health: {}
  opamp/reporting:
    server:
      ws:
        endpoint: wss://opamp.telecraft.internal/v1/opamp
service:
  extensions:
    - health_check/health
    - opamp/reporting
  pipelines:
    traces:
      receivers:
        - kafka/kafka-in
      processors:
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlp_http/data-flow.gateway-exporter
    logs:
      receivers:
        - kafka/kafka-in
      processors:
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlp_http/data-flow.gateway-exporter
  telemetry:
    resource:
      # Node-unique identity via the Downward API: the install guide sets
      # TELECRAFT_NODE_NAME from spec.nodeName, so one DaemonSet manifest
      # gives each node its own identity.
      k8s.node.name: ${env:TELECRAFT_NODE_NAME}
      # The artefact carries its own identity: the commit it was rendered from.
      telecraft.commit: c895127500d1bc82cee81b258c5e76042b2653aa
      # The Tier this artefact belongs to. With the commit stamp, it joins
      # each self-telemetry reading back to the artefact that produced it.
      telecraft.tier: data-flow/kafka-bridge
    # Self-telemetry goes to the estate's declared destination over its
    # own exporter and connection, never through this Tier's data
    # pipelines. Internal traces stay off in v1. These exporters take the
    # endpoint as the complete URL, so the renderer adds the signal path
    # here rather than at run time.
    metrics:
      level: normal
      readers:
        - periodic:
            exporter:
              otlp:
                endpoint: https://otlp-prod.observability.internal:4318/v1/metrics
                protocol: http/protobuf
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                endpoint: https://otlp-prod.observability.internal:4318/v1/logs
                protocol: http/protobuf
