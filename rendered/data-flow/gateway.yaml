# Generated by the telecraft renderer — humans never commit here (ADR-0027, ADR-0028).
# Tier data-flow/gateway (production), Blueprint data-flow/gateway-standard@5, commit dea1233454af2285b1c7c2f130d396a6046b9293.
receivers:
  otlp/otlp-in:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  # Generated: data crossing an untrusted Hop sheds the platform's
  # attribute namespace; identity is re-derived from this Tier's own
  # stamps, never from inbound data (REQ-034, ADR-0007, ADR-0013).
  attributes/telecraft.untrusted-hop:
    actions:
      - action: delete
        pattern: ^telecraft\.
  batch/batcher:
    send_batch_size: 8192
    timeout: 5s
  memory_limiter/guard:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  transform/infosec.pii-redaction:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "\\b\\d{13,16}\\b", "[redacted-pan]")
          - replace_pattern(body, "[\\w.+-]+@[\\w-]+\\.[\\w.]+", "[redacted-email]")
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "http.request.header.authorization")
          - delete_key(attributes, "enduser.id")
exporters:
  otlp_http/data-flow.gateway-exporter:
    compression: gzip
    endpoint: https://ingest.observability.internal:4318
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 10000
extensions:
  health_check/health:
    endpoint: 0.0.0.0:13133
  opamp/reporting:
    server:
      ws:
        endpoint: wss://opamp.telecraft.internal/v1/opamp
service:
  extensions:
    - health_check/health
    - opamp/reporting
  pipelines:
    traces:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - transform/infosec.pii-redaction
        - batch/batcher
      exporters:
        - otlp_http/data-flow.gateway-exporter
    metrics:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlp_http/data-flow.gateway-exporter
    logs:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - transform/infosec.pii-redaction
        - batch/batcher
      exporters:
        - otlp_http/data-flow.gateway-exporter
  telemetry:
    resource:
      # Node-unique identity via the Downward API: install guidance feeds
      # TELECRAFT_NODE_NAME from spec.nodeName, so one DaemonSet manifest
      # yields per-node identity (REQ-034, ADR-0010).
      k8s.node.name: ${env:TELECRAFT_NODE_NAME}
      # The artefact carries its own identity (ADR-0013).
      telecraft.commit: dea1233454af2285b1c7c2f130d396a6046b9293
      # The Tier half of the reading join: reading → (Tier, SHA) → artefact
      # → claims (ADR-0039 §5). A reading, never a back-door Effective.
      telecraft.tier: data-flow/gateway
    # Self-telemetry pushes to the estate's declared destination over its
    # own exporter and connection — never through this Tier's own data
    # pipelines (REQ-053, ADR-0039 §2). Internal traces stay off in v1.
    metrics:
      level: normal
      readers:
        - periodic:
            exporter:
              otlp:
                endpoint: https://otlp-prod.observability.internal:4318
                protocol: http/protobuf
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                endpoint: https://otlp-prod.observability.internal:4318
                protocol: http/protobuf
