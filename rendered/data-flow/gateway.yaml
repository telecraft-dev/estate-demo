# Generated by the telecraft renderer. Do not edit by hand: change the source in git and render again.
# Tier data-flow/gateway (production), Blueprint data-flow/gateway-standard@5, commit c895127500d1bc82cee81b258c5e76042b2653aa.
receivers:
  otlp/otlp-in:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  # Generated: this Tier receives data over an untrusted Hop, so this
  # processor drops every telecraft.* attribute on arrival. Identity
  # comes from this Tier's own stamps, never from inbound data.
  attributes/telecraft.untrusted-hop:
    actions:
      - action: delete
        pattern: ^telecraft\.
  batch/batcher:
    send_batch_size: 8192
    timeout: 5s
  memory_limiter/guard:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  transform/infosec.pii-redaction:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "\\b\\d{13,16}\\b", "[redacted-pan]")
          - replace_pattern(body, "[\\w.+-]+@[\\w-]+\\.[\\w.]+", "[redacted-email]")
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "http.request.header.authorization")
          - delete_key(attributes, "enduser.id")
exporters:
  otlp_http/data-flow.gateway-exporter:
    compression: gzip
    endpoint: https://ingest.observability.internal:4318
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 10000
extensions:
  health_check/health:
    endpoint: 0.0.0.0:13133
  opamp/reporting:
    server:
      ws:
        endpoint: wss://opamp.telecraft.internal/v1/opamp
service:
  extensions:
    - health_check/health
    - opamp/reporting
  pipelines:
    traces:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - transform/infosec.pii-redaction
        - batch/batcher
      exporters:
        - otlp_http/data-flow.gateway-exporter
    metrics:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlp_http/data-flow.gateway-exporter
    logs:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - transform/infosec.pii-redaction
        - batch/batcher
      exporters:
        - otlp_http/data-flow.gateway-exporter
  telemetry:
    resource:
      # Node-unique identity via the Downward API: the install guide sets
      # TELECRAFT_NODE_NAME from spec.nodeName, so one DaemonSet manifest
      # gives each node its own identity.
      k8s.node.name: ${env:TELECRAFT_NODE_NAME}
      # The artefact carries its own identity: the commit it was rendered from.
      telecraft.commit: c895127500d1bc82cee81b258c5e76042b2653aa
      # The Tier this artefact belongs to. With the commit stamp, it joins
      # each self-telemetry reading back to the artefact that produced it.
      telecraft.tier: data-flow/gateway
    # Self-telemetry goes to the estate's declared destination over its
    # own exporter and connection, never through this Tier's data
    # pipelines. Internal traces stay off in v1. These exporters take the
    # endpoint as the complete URL, so the renderer adds the signal path
    # here rather than at run time.
    metrics:
      level: normal
      readers:
        - periodic:
            exporter:
              otlp:
                endpoint: https://otlp-prod.observability.internal:4318/v1/metrics
                protocol: http/protobuf
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                endpoint: https://otlp-prod.observability.internal:4318/v1/logs
                protocol: http/protobuf
