# Generated by the telecraft renderer. Do not edit by hand: change the source in git and render again.
# Tier edge-ops/edge (production), Blueprint edge-ops/node-agent@3, commit c895127500d1bc82cee81b258c5e76042b2653aa.
receivers:
  file_log/tail:
    include:
      - /var/log/pods/*/*/*.log
    include_file_path: true
    start_at: end
  host_metrics/node:
    collection_interval: 30s
    scrapers:
      cpu: {}
      filesystem: {}
      memory: {}
      network: {}
  otlp/otlp-in:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  batch/batcher:
    send_batch_size: 4096
    timeout: 5s
  k8s_attributes/enrich:
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.node.name
        - k8s.deployment.name
    passthrough: false
  memory_limiter/guard:
    check_interval: 1s
    limit_percentage: 60
    spike_limit_percentage: 20
exporters:
  otlp_http/forward:
    compression: gzip
    endpoint: https://gateway.telemetry.internal:4318
extensions:
  file_storage/spool:
    directory: /var/lib/otelcol/spool
  health_check/health: {}
service:
  extensions:
    - health_check/health
    - file_storage/spool
  pipelines:
    traces:
      receivers:
        - otlp/otlp-in
      processors:
        - k8s_attributes/enrich
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlp_http/forward
    metrics:
      receivers:
        - host_metrics/node
      processors:
        - k8s_attributes/enrich
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlp_http/forward
    logs:
      receivers:
        - file_log/tail
      processors:
        - k8s_attributes/enrich
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlp_http/forward
  telemetry:
    resource:
      # Node-unique identity via the Downward API: the install guide sets
      # TELECRAFT_NODE_NAME from spec.nodeName, so one DaemonSet manifest
      # gives each node its own identity.
      k8s.node.name: ${env:TELECRAFT_NODE_NAME}
      # The artefact carries its own identity: the commit it was rendered from.
      telecraft.commit: c895127500d1bc82cee81b258c5e76042b2653aa
      # The Tier this artefact belongs to. With the commit stamp, it joins
      # each self-telemetry reading back to the artefact that produced it.
      telecraft.tier: edge-ops/edge
    # Self-telemetry goes to the estate's declared destination over its
    # own exporter and connection, never through this Tier's data
    # pipelines. Internal traces stay off in v1. These exporters take the
    # endpoint as the complete URL, so the renderer adds the signal path
    # here rather than at run time.
    metrics:
      level: normal
      readers:
        - periodic:
            exporter:
              otlp:
                endpoint: https://otlp-prod.observability.internal:4318/v1/metrics
                protocol: http/protobuf
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                endpoint: https://otlp-prod.observability.internal:4318/v1/logs
                protocol: http/protobuf
