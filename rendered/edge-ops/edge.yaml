# Generated by the telecraft renderer — humans never commit here (ADR-0027, ADR-0028).
# Tier edge-ops/edge (production), Blueprint edge-ops/node-agent@3, commit dea1233454af2285b1c7c2f130d396a6046b9293.
receivers:
  file_log/tail:
    include:
      - /var/log/pods/*/*/*.log
    include_file_path: true
    start_at: end
  host_metrics/node:
    collection_interval: 30s
    scrapers:
      cpu: {}
      filesystem: {}
      memory: {}
      network: {}
  otlp/otlp-in:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  batch/batcher:
    send_batch_size: 4096
    timeout: 5s
  k8s_attributes/enrich:
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.node.name
        - k8s.deployment.name
    passthrough: false
  memory_limiter/guard:
    check_interval: 1s
    limit_percentage: 60
    spike_limit_percentage: 20
exporters:
  otlp_http/forward:
    compression: gzip
    endpoint: https://gateway.telemetry.internal:4318
extensions:
  file_storage/spool:
    directory: /var/lib/otelcol/spool
  health_check/health: {}
service:
  extensions:
    - health_check/health
    - file_storage/spool
  pipelines:
    traces:
      receivers:
        - otlp/otlp-in
      processors:
        - k8s_attributes/enrich
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlp_http/forward
    metrics:
      receivers:
        - host_metrics/node
      processors:
        - k8s_attributes/enrich
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlp_http/forward
    logs:
      receivers:
        - file_log/tail
      processors:
        - k8s_attributes/enrich
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlp_http/forward
  telemetry:
    resource:
      # Node-unique identity via the Downward API: install guidance feeds
      # TELECRAFT_NODE_NAME from spec.nodeName, so one DaemonSet manifest
      # yields per-node identity (REQ-034, ADR-0010).
      k8s.node.name: ${env:TELECRAFT_NODE_NAME}
      # The artefact carries its own identity (ADR-0013).
      telecraft.commit: dea1233454af2285b1c7c2f130d396a6046b9293
      # The Tier half of the reading join: reading → (Tier, SHA) → artefact
      # → claims (ADR-0039 §5). A reading, never a back-door Effective.
      telecraft.tier: edge-ops/edge
    # Self-telemetry pushes to the estate's declared destination over its
    # own exporter and connection — never through this Tier's own data
    # pipelines (REQ-053, ADR-0039 §2). Internal traces stay off in v1.
    metrics:
      level: normal
      readers:
        - periodic:
            exporter:
              otlp:
                endpoint: https://otlp-prod.observability.internal:4318
                protocol: http/protobuf
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                endpoint: https://otlp-prod.observability.internal:4318
                protocol: http/protobuf
