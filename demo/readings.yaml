# The estate's runtime readings: the two things a repository cannot hold.
#
# In production the collector estate arrives through the EstateProvider seam
# and the arrivals through the TelemetryProvider seam, both from live
# systems. A
# demo estate has neither, so it declares them here and `telecraft snapshot`
# plays them back through the same seams. Everything judged from them — the
# populations, the bands, every finding in every drawer — is the product's
# own evaluators running over this file and the authored YAML beside it.
#
# Editing a reading here changes what the demo shows on the next push, which
# is the point: this is the knob that makes a state demonstrable.

