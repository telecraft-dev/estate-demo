rows:
  # The arrivals per (Service, Environment) — the Observed leg of the
  # verdict cross (ADR-0004). A signal declared unknown is "we cannot see",
  # which is never rendered as "it is absent" (ADR-0008).

  - service: checkout/payments
    environment: production
    signals:
      traces: {present: true, volume: 4182930, attribute_coverage: {service.namespace: 0.999, deployment.environment.name: 0.998}}
      logs: {present: true, volume: 18402117}
      metrics: {present: true, volume: 2210044}

  - service: checkout/payments
    environment: staging
    signals:
      traces: {present: true, volume: 41208}
      # Staging stopped shipping logs when the namespace was rebuilt. No
      # Requirement covers logs outside production, so nothing in the cross
      # fails — but the rendered config still routes a logs lane, and that
      # lane is an arrival claim nothing backs (ADR-0038 §5).
      logs: {present: false, volume: 0, since: 2026-08-14T11:20:00Z}
      metrics: {present: true, volume: 9921}

  - service: checkout/basket
    environment: production
    signals:
      traces: {present: true, volume: 2904881, attribute_coverage: {service.namespace: 0.997, deployment.environment.name: 0.996}}
      logs: {present: true, volume: 7710233}
      metrics: {present: true, volume: 1180291}

  - service: storefront/catalogue-web
    environment: production
    signals:
      # Spans stopped arriving after the mobile release: the pipeline is
      # configured and delivering nothing. Effective says yes, Observed says
      # no — broken_pipeline, the most valuable finding the platform
      # produces and invisible to any tool that reads config alone.
      traces: {present: false, volume: 0, since: 2026-08-17T19:05:00Z, attribute_coverage: {}}
      logs: {present: true, volume: 5512908}
      metrics: {present: true, volume: 902113}

  - service: storefront/search
    environment: production
    signals:
      traces: {present: true, volume: 881204, attribute_coverage: {service.namespace: 0.981, deployment.environment.name: 0.979}}
      logs: {present: true, volume: 1204778}
      # Mid-migration to the shared metrics SDK. An authored Exemption waives
      # the count until the end of January; the diagnosis stays.
      metrics: {present: false, volume: 0, since: 2026-07-28T09:00:00Z}

tiers:
  # The self-telemetry reading per Tier (ADR-0039). `emitting: [all]` says
  # every component the artefact instantiates reports its own telemetry;
  # the generator renders that into the join-key attribute combinations R-4
  # pins, and the platform's own normaliser reads them back.

  - tier: data-flow/gateway
    signals:
      metrics: {present: true, volume: 412880}
      logs: {present: true, volume: 20114}
    emitting: [all]

  - tier: data-flow/gateway-staging
    signals:
      metrics: {present: true, volume: 18220}
      logs: {present: true, volume: 1902}
    emitting: [all]

  - tier: data-flow/kafka-bridge
    signals:
      metrics: {present: true, volume: 288104}
      logs: {present: true, volume: 9921}
    emitting: [all]
    # The batch processor has emitted nothing since the bridge was rebuilt,
    # while every other component on the Tier reports normally. The artefact
    # instantiates it and it is silent past the settle window: "the config
    # didn't work" in its sharpest form (ADR-0038 §5c).
    silent: [batch/batcher]
    shortfall_since: 2026-08-18T04:00:00Z

  - tier: edge-ops/edge
    signals:
      metrics: {present: true, volume: 1804221}
      logs: {present: true, volume: 44120}
    emitting: [all]

  - tier: edge-ops/edge-arm
    # The arm64 pool was authored ahead of the migration and nothing has
    # ever matched it. Watching started in May; the shortfall has persisted
    # ever since, which is what escalates a neutral never_seen to a
    # violation against the declared floor (ADR-0035 §4).
    signals:
      metrics: {known: false, cause: no self-telemetry has ever arrived for this Tier}
      logs: {known: false, cause: no self-telemetry has ever arrived for this Tier}
    ever_seen: false
    first_watched: 2026-05-02T00:00:00Z
    shortfall_since: 2026-05-02T00:00:00Z

  - tier: storefront/mobile-edge
    signals:
      metrics: {present: true, volume: 96220}
      logs: {present: true, volume: 4410}
    emitting: [all]

