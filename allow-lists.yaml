# The declared Allow-lists (ADR-0021 §5). A Team's list is one intersection
# term: the effective palette narrows down the tree, and widening happens
# only through a Grant an ancestor authored. Platform declares the estate's
# working set; Data Flow narrows to the aggregation components it actually
# uses; Storefront narrows harder still.
allow_lists:
  - team: platform
    owner: platform-observability
    allow:
      - receiver/otlp
      - receiver/file_log
      - receiver/host_metrics
      - receiver/kafka
      - processor/*
      - exporter/otlp_http
      - exporter/debug
      - extension/*
      - connector/*
  - team: data-flow
    owner: gateway-owners
    allow:
      - receiver/otlp
      - receiver/kafka
      - processor/batch
      - processor/memory_limiter
      - processor/transform
      - processor/tail_sampling
      - exporter/otlp_http
      - extension/health_check
      - extension/opamp
  - team: storefront
    owner: storefront-team
    allow:
      - receiver/otlp
      - processor/batch
      - processor/memory_limiter
      - processor/filter
      - exporter/otlp_http
      - extension/health_check
      - extension/opamp
