# The staging sibling: same team, same Blueprint at the same pin, a
# different declared Environment. Per-Environment binding is realised
# through sibling Tiers (ADR-0025 §3), and non-production carries no
# stability floor — staging is where alpha components are supposed to be
# exercised (ADR-0023 §3).
owner: gateway-owners
environment: staging
blueprint: data-flow/gateway-standard@5
selector:
  telecraft.tier: gateway
  deployment.environment: staging
serving:
  endpoint: wss://opamp-staging.telecraft.internal/v1/opamp
hops:
  - from: internet
